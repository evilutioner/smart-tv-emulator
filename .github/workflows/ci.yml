name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        run: python -m unittest discover -s tests
      - name: JavaScript syntax
        run: |
          for file in src/tvemu/web/*.js src/tvemu/web/platforms/*.js; do
            cp "$file" "${file%.js}.mjs"
            node --check "${file%.js}.mjs"
            rm "${file%.js}.mjs"
          done
      - name: Package
        run: python -m build

  # The platforms this build ships, read off the registry rather than written here, so the
  # same file gates a build of one television or of ten.
  platforms:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - id: ids
        run: |
          echo "ids=$(python -c 'import json; from tvemu.platforms import platform_ids; print(json.dumps(list(platform_ids())))')" >> "$GITHUB_OUTPUT"

  # Captured client traffic through the real listeners, one job per television so a wire
  # regression names its set. A failed case fails everywhere; an uncovered replay fails only
  # where the platform declares its coverage complete.
  conformance:
    needs: platforms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Replay conformance
        run: >-
          python -m tvemu.conformance --platform ${{ matrix.platform }} --gate
          --json-report conformance-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: conformance-${{ matrix.platform }}
          path: conformance-${{ matrix.platform }}.json
