<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">How captured evidence becomes a trustworthy emulator answer</title>
  <desc id="desc">A physical television or official app is observed once. Its requests and exact response bytes are stored in an immutable capture. The same capture drives the runnable emulator and the driver contract. CI compares expected and actual bytes, and a real remote app is driven against the emulator.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#16324f" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#3266a8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 44px; font-weight: 750; letter-spacing: -.7px; }
      .subtitle { font-size: 21px; fill: #5d6b7e; }
      .step { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
      .card-title { font-size: 25px; font-weight: 750; }
      .copy { font-size: 18px; fill: #536174; }
      .small { font-size: 17px; fill: #64748b; }
      .arrow-label { font-size: 17px; font-weight: 700; fill: #3266a8; }
      .line { fill: none; stroke: #3266a8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="800" fill="#f8fbfd"/>
  <text x="800" y="68" text-anchor="middle" class="title">Why the emulator answers like a real TV</text>
  <text x="800" y="105" text-anchor="middle" class="subtitle">One recorded exchange feeds the emulator, the contract, and the checks.</text>

  <text x="198" y="163" text-anchor="middle" class="step" fill="#b45309">1 · OBSERVE</text>
  <text x="538" y="163" text-anchor="middle" class="step" fill="#7c3aed">2 · RECORD ONCE</text>
  <text x="945" y="163" text-anchor="middle" class="step" fill="#2563eb">3 · REUSE THE EVIDENCE</text>
  <text x="1370" y="163" text-anchor="middle" class="step" fill="#047857">4 · VERIFY</text>

  <!-- Observe -->
  <g filter="url(#shadow)">
    <rect x="62" y="205" width="272" height="408" rx="28" fill="#fffaf0" stroke="#e7ad47" stroke-width="3"/>
  </g>
  <rect x="101" y="247" width="194" height="126" rx="13" fill="#ffffff" stroke="#dda53f" stroke-width="3"/>
  <path d="M168 375l-10 28h80l-10-28" fill="#dda53f" opacity=".28"/>
  <rect x="148" y="401" width="100" height="10" rx="5" fill="#c98b25" opacity=".5"/>
  <path d="M139 286h118M139 314h88M139 342h104" stroke="#efc66d" stroke-width="8" stroke-linecap="round"/>
  <circle cx="249" cy="512" r="45" fill="#ffffff" stroke="#dda53f" stroke-width="3"/>
  <path d="M229 511a20 20 0 0140 0M237 519a12 12 0 0124 0" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
  <circle cx="249" cy="531" r="4" fill="#b45309"/>
  <rect x="92" y="470" width="90" height="122" rx="18" fill="#ffffff" stroke="#dda53f" stroke-width="3"/>
  <circle cx="137" cy="568" r="7" fill="none" stroke="#dda53f" stroke-width="2"/>
  <text x="198" y="451" text-anchor="middle" class="card-title">Real behavior</text>
  <text x="198" y="642" text-anchor="middle" class="copy">Physical TV</text>
  <text x="198" y="670" text-anchor="middle" class="copy">or official app</text>

  <!-- Capture -->
  <path d="M348 407H399" class="line"/>
  <text x="373" y="386" text-anchor="middle" class="arrow-label">watch</text>
  <g filter="url(#shadow)">
    <rect x="417" y="220" width="282" height="378" rx="28" fill="#f5f0ff" stroke="#a78bfa" stroke-width="3"/>
  </g>
  <g transform="translate(480 260)">
    <rect x="0" y="16" width="116" height="144" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="20" y="0" width="116" height="144" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="78" y="34" text-anchor="middle" font-size="14" font-weight="750" fill="#7c3aed">WIRE EXCHANGE</text>
    <path d="M42 60h72M42 81h53M42 102h72" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round"/>
    <path d="M44 128h27" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <path d="M104 128H77" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
    <path d="M68 128l-8-6v12z" fill="#2563eb"/>
    <path d="M80 128l8-6v12z" fill="#7c3aed"/>
  </g>
  <text x="558" y="470" text-anchor="middle" class="card-title">Immutable capture</text>
  <text x="558" y="506" text-anchor="middle" class="copy">request + exact reply bytes</text>
  <rect x="472" y="536" width="172" height="36" rx="18" fill="#e7ddff"/>
  <path d="M496 548v-6a10 10 0 0120 0v6m-24 0h28v17h-28z" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="532" y="560" class="small" font-weight="700" fill="#6d28d9">never edited</text>

  <!-- Reuse: emulator -->
  <path d="M714 386C754 386 759 290 804 290" class="line"/>
  <g filter="url(#shadow)">
    <rect x="818" y="205" width="298" height="218" rx="25" fill="#eef5ff" stroke="#79a8f5" stroke-width="3"/>
  </g>
  <rect x="858" y="246" width="106" height="72" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <path d="M895 320l-7 20h45l-7-20" fill="#2563eb" opacity=".2"/>
  <rect x="882" y="338" width="56" height="7" rx="4" fill="#2563eb" opacity=".45"/>
  <path d="M881 270h60M881 288h44" stroke="#93b7f6" stroke-width="6" stroke-linecap="round"/>
  <text x="1000" y="270" class="card-title">Emulator</text>
  <text x="1000" y="303" class="copy">replays the same</text>
  <text x="1000" y="330" class="copy">response bytes</text>
  <rect x="858" y="370" width="218" height="30" rx="15" fill="#dbeafe"/>
  <text x="967" y="391" text-anchor="middle" class="small" font-weight="700" fill="#1746a2">captured bytes → live reply</text>

  <!-- Reuse: contract -->
  <path d="M714 430C754 430 759 530 804 530" class="line"/>
  <g filter="url(#shadow)">
    <rect x="818" y="454" width="298" height="218" rx="25" fill="#eef5ff" stroke="#79a8f5" stroke-width="3"/>
  </g>
  <rect x="856" y="493" width="92" height="124" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <path d="M876 520h51M876 541h38M876 562h51M876 583h31" stroke="#93b7f6" stroke-width="6" stroke-linecap="round"/>
  <text x="980" y="520" class="card-title">Driver contract</text>
  <text x="980" y="555" class="copy">OpenAPI · AsyncAPI</text>
  <text x="980" y="583" class="copy">+ curated claims</text>
  <text x="980" y="625" class="small">describes what clients can rely on</text>

  <!-- Verify -->
  <path d="M1132 314H1200" class="line"/>
  <text x="1166" y="292" text-anchor="middle" class="arrow-label">actual</text>
  <path d="M700 575C852 752 1090 748 1214 410" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 9" marker-end="url(#arrow-purple)"/>
  <text x="967" y="728" text-anchor="middle" class="small" fill="#7c3aed">the capture supplies the expected bytes</text>
  <g filter="url(#shadow)">
    <rect x="1218" y="205" width="320" height="218" rx="25" fill="#edf9f4" stroke="#66c2a3" stroke-width="3"/>
  </g>
  <circle cx="1272" cy="274" r="31" fill="#10b981"/>
  <path d="M1257 274l10 10 20-23" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1318" y="266" class="card-title">Byte-for-byte</text>
  <text x="1318" y="298" class="card-title">check in CI</text>
  <path d="M1256 349h240" stroke="#a9dcca" stroke-width="2"/>
  <text x="1378" y="380" text-anchor="middle" class="copy">expected reply = actual reply</text>

  <path d="M1132 380C1177 380 1177 536 1200 536" class="line"/>
  <g filter="url(#shadow)">
    <rect x="1218" y="454" width="320" height="218" rx="25" fill="#edf9f4" stroke="#66c2a3" stroke-width="3"/>
  </g>
  <circle cx="1272" cy="523" r="31" fill="#10b981"/>
  <path d="M1257 523l10 10 20-23" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1318" y="515" class="card-title">Real app</text>
  <text x="1318" y="547" class="card-title">validation</text>
  <path d="M1256 598h240" stroke="#a9dcca" stroke-width="2"/>
  <text x="1378" y="629" text-anchor="middle" class="copy">a vendor app drives tvemu</text>
</svg>
