<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">How real-device evidence becomes emulator replies, driver contracts and verification checks</title>
  <desc id="desc">A real television or vendor app is recorded once into an immutable capture of each request and its exact reply bytes. The emulator replays those bytes and the driver contract is derived from them. A check in CI sends each captured request to the emulator and compares the reply with the capture byte for byte.</desc>
  <style>
    text { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
    .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .src { fill: #fff8eb; stroke: #BA7517; stroke-width: 1.5; }
    .cap { fill: #fbf7ff; stroke: #8250df; stroke-width: 2; }
    .use { fill: #f1f7ff; stroke: #185FA5; stroke-width: 1.5; }
    .chk { fill: #effaf2; stroke: #1a7f37; stroke-width: 1.5; }
    .line { stroke: #6e7781; stroke-width: 1.5; fill: none; }
    .dash { stroke: #8250df; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #6e7781; } .dhead { fill: #8250df; }
    @media (prefers-color-scheme: dark) {
      text { fill: #9198a1; } .h { fill: #e6edf3; }
      .src { fill: #2a1f0d; stroke: #EF9F27; }
      .cap { fill: #1d1530; stroke: #a371f7; }
      .use { fill: #0f1d2e; stroke: #85B7EB; }
      .chk { fill: #0f2417; stroke: #3fb950; }
      .line { stroke: #9198a1; } .head { fill: #9198a1; }
      .dash { stroke: #a371f7; } .dhead { fill: #a371f7; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="dhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- 1. observe -->
  <rect class="src" x="10" y="120" width="160" height="80" rx="12"/>
  <text class="h" x="90" y="154" text-anchor="middle">Real television</text>
  <text x="90" y="176" text-anchor="middle">or vendor app</text>

  <line class="line" x1="174" y1="160" x2="226" y2="160" marker-end="url(#a)"/>
  <text x="200" y="150" text-anchor="middle">record</text>

  <!-- 2. record once -->
  <rect class="cap" x="230" y="105" width="180" height="110" rx="12"/>
  <text class="h" x="320" y="140" text-anchor="middle">Capture</text>
  <text x="320" y="164" text-anchor="middle">request + exact</text>
  <text x="320" y="182" text-anchor="middle">reply bytes,</text>
  <text x="320" y="200" text-anchor="middle">never edited</text>

  <!-- 3. reuse -->
  <path class="line" d="M414 135 C 450 135, 450 100, 486 100" marker-end="url(#a)"/>
  <path class="line" d="M414 185 C 450 185, 450 230, 486 230" marker-end="url(#a)"/>

  <rect class="use" x="490" y="62" width="180" height="76" rx="12"/>
  <text class="h" x="580" y="94" text-anchor="middle">Emulator</text>
  <text x="580" y="116" text-anchor="middle">replays the bytes</text>

  <rect class="use" x="490" y="192" width="180" height="76" rx="12"/>
  <text class="h" x="580" y="224" text-anchor="middle">Driver contract</text>
  <text x="580" y="246" text-anchor="middle">OpenAPI · AsyncAPI</text>

  <!-- 4. verify -->
  <rect class="chk" x="720" y="120" width="150" height="80" rx="12"/>
  <text class="h" x="795" y="154" text-anchor="middle">Check in CI</text>
  <text x="795" y="176" text-anchor="middle">byte for byte</text>

  <path class="line" d="M674 100 C 700 100, 700 140, 716 145" marker-end="url(#a)"/>
  <text x="694" y="88" text-anchor="middle">actual</text>
  <path class="dash" d="M320 101 L 320 30 L 795 30 L 795 116" marker-end="url(#d)"/>
  <text x="560" y="22" text-anchor="middle">expected</text>
</svg>
