<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How a remote app interacts with tvemu</title>
  <desc id="desc">A remote app discovers, pairs with, and controls tvemu as if it were a television. Captured replies make the emulation realistic. The user inspects device state in a dashboard, while CI and coding agents use the local API, scenario checker, and MCP server.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#16324f" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#047857"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 46px; font-weight: 750; letter-spacing: -.8px; }
      .subtitle { font-size: 22px; fill: #5d6b7e; }
      .zone { font-size: 21px; font-weight: 750; letter-spacing: .8px; }
      .card-title { font-size: 27px; font-weight: 750; }
      .card-copy { font-size: 19px; fill: #536174; }
      .small { font-size: 18px; fill: #64748b; }
      .label { font-size: 18px; font-weight: 700; }
      .chip { font-size: 16px; font-weight: 700; fill: #1746a2; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7fafc"/>
  <text x="800" y="72" text-anchor="middle" class="title">Your app talks to tvemu like a real TV</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">The app uses normal TV protocols. You inspect what happened.</text>

  <text x="240" y="174" text-anchor="middle" class="zone" fill="#2563eb">YOUR TEST CLIENT</text>
  <text x="760" y="174" text-anchor="middle" class="zone" fill="#b45309">ACTS LIKE THE TV</text>
  <text x="1300" y="174" text-anchor="middle" class="zone" fill="#047857">YOU INSPECT IT</text>

  <!-- Remote app / driver -->
  <g filter="url(#shadow)">
    <rect x="92" y="212" width="296" height="510" rx="42" fill="#ffffff" stroke="#8db7ff" stroke-width="3"/>
    <rect x="112" y="242" width="256" height="426" rx="25" fill="#eef5ff"/>
    <rect x="181" y="226" width="118" height="9" rx="5" fill="#9db1c7"/>
    <circle cx="240" cy="690" r="13" fill="none" stroke="#9db1c7" stroke-width="3"/>
  </g>
  <rect x="137" y="275" width="206" height="62" rx="14" fill="#2563eb"/>
  <text x="240" y="313" text-anchor="middle" font-size="23" font-weight="750" fill="#ffffff">Remote app</text>
  <circle cx="240" cy="410" r="54" fill="#ffffff" stroke="#7ba8ef" stroke-width="3"/>
  <path d="M210 409a30 30 0 0160 0M221 419a19 19 0 0138 0M234 430a6 6 0 0112 0" class="line" stroke="#2563eb" stroke-width="7"/>
  <circle cx="240" cy="442" r="6" fill="#2563eb"/>
  <text x="240" y="501" text-anchor="middle" class="card-title">App or driver</text>
  <text x="240" y="533" text-anchor="middle" class="card-copy">under test</text>
  <text x="240" y="594" text-anchor="middle" class="small">Normal LAN connection</text>

  <!-- TV / tvemu -->
  <g filter="url(#shadow)">
    <rect x="554" y="218" width="414" height="330" rx="28" fill="#fffaf0" stroke="#e7ad47" stroke-width="4"/>
    <rect x="580" y="244" width="362" height="252" rx="17" fill="#ffffff" stroke="#f0c878" stroke-width="2"/>
  </g>
  <path d="M702 550l-22 61h162l-22-61" fill="#d6a34a" opacity=".24"/>
  <rect x="652" y="607" width="218" height="20" rx="10" fill="#c98b25" opacity=".45"/>
  <text x="761" y="282" text-anchor="middle" class="card-title">tvemu</text>
  <text x="761" y="311" text-anchor="middle" class="small">one Python process</text>
  <g>
    <rect x="616" y="338" width="290" height="44" rx="12" fill="#fff2cf"/>
    <circle cx="644" cy="360" r="11" fill="#f59e0b"/>
    <path d="M638 360a6 6 0 0112 0m-9 3a3 3 0 016 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="668" y="367" class="label">Discovery</text>
    <text x="884" y="367" text-anchor="end" class="small">Broadcasting</text>

    <rect x="616" y="392" width="290" height="44" rx="12" fill="#fff2cf"/>
    <circle cx="644" cy="414" r="11" fill="#f59e0b"/>
    <path d="M639 414l4 4 7-9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="668" y="421" class="label">Pairing</text>
    <text x="884" y="421" text-anchor="end" class="small">Waiting for app</text>

    <rect x="616" y="446" width="290" height="44" rx="12" fill="#fff2cf"/>
    <circle cx="644" cy="468" r="11" fill="#f59e0b"/>
    <path d="M639 468h10m-5-5v10" stroke="#fff" stroke-width="2"/>
    <text x="668" y="475" class="label">TV protocol</text>
    <text x="884" y="475" text-anchor="end" class="small">Listening</text>
  </g>
  <text x="761" y="671" text-anchor="middle" class="card-title">Emulated television</text>
  <text x="761" y="702" text-anchor="middle" class="card-copy">on your LAN address</text>

  <!-- App to TV arrow -->
  <rect x="397" y="321" width="144" height="62" rx="22" fill="#dbeafe"/>
  <text x="469" y="347" text-anchor="middle" class="chip">DISCOVER · PAIR</text>
  <text x="469" y="371" text-anchor="middle" class="chip">CONTROL</text>
  <path d="M405 412H528" class="line" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M528 471H405" class="line" stroke="#475569" stroke-width="4" marker-end="url(#arrow-slate)"/>
  <rect x="407" y="492" width="120" height="35" rx="18" fill="#e8edf3"/>
  <text x="467" y="516" text-anchor="middle" class="small">TV replies</text>

  <!-- Dashboard -->
  <g filter="url(#shadow)">
    <rect x="1090" y="218" width="414" height="286" rx="24" fill="#ffffff" stroke="#79cbb2" stroke-width="3"/>
  </g>
  <rect x="1090" y="218" width="414" height="48" rx="24" fill="#e7f8f1"/>
  <path d="M1090 242a24 24 0 0124-24h366a24 24 0 0124 24v24h-414z" fill="#e7f8f1"/>
  <circle cx="1123" cy="242" r="7" fill="#fb7185"/>
  <circle cx="1147" cy="242" r="7" fill="#fbbf24"/>
  <circle cx="1171" cy="242" r="7" fill="#34d399"/>
  <rect x="1210" y="230" width="242" height="24" rx="12" fill="#ffffff" stroke="#c6ded5"/>
  <text x="1297" y="311" text-anchor="middle" class="card-title">Dashboard</text>
  <rect x="1124" y="342" width="346" height="50" rx="14" fill="#effaf6"/>
  <circle cx="1155" cy="367" r="16" fill="#10b981" opacity=".18"/>
  <path d="M1155 356v13m-8-8a12 12 0 1016 0" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="1183" y="374" class="label">Power on</text>
  <text x="1442" y="374" text-anchor="end" class="small">Volume 18 · unmuted</text>
  <rect x="1124" y="406" width="346" height="56" rx="14" fill="#effaf6"/>
  <text x="1146" y="439" class="small">EVENT LOG</text>
  <path d="M1264 425h170M1264 443h126" stroke="#5fac91" stroke-width="6" stroke-linecap="round" opacity=".65"/>
  <rect x="996" y="307" width="62" height="32" rx="16" fill="#dff5ed"/>
  <text x="1027" y="329" text-anchor="middle" class="small">state</text>
  <path d="M990 365H1062" class="line" stroke="#047857" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="1297" y="534" text-anchor="middle" class="card-copy">Open in your browser</text>

  <!-- CI / agent -->
  <g filter="url(#shadow)">
    <rect x="1090" y="582" width="414" height="180" rx="24" fill="#ffffff" stroke="#79cbb2" stroke-width="3"/>
  </g>
  <rect x="1124" y="619" width="82" height="82" rx="18" fill="#e7f8f1"/>
  <path d="M1148 647h34m-34 14h25m-25 14h34" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <text x="1238" y="630" class="card-title">CI or coding agent</text>
  <text x="1238" y="666" class="card-copy">/api/v1 · expect · MCP</text>
  <text x="1238" y="700" class="small">asserts what the app sent</text>
  <rect x="994" y="594" width="66" height="32" rx="16" fill="#dff5ed"/>
  <text x="1027" y="616" text-anchor="middle" class="small">events</text>
  <path d="M990 650H1062" class="line" stroke="#047857" stroke-width="5" marker-end="url(#arrow-green)"/>

  <!-- Capture source -->
  <g filter="url(#shadow)">
    <rect x="494" y="776" width="534" height="82" rx="24" fill="#f3edff" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <g transform="translate(526 793)">
    <rect x="0" y="8" width="42" height="32" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="8" y="0" width="42" height="32" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <path d="M17 10h24M17 19h17" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="594" y="811" class="label">Evidence from real TVs and official apps</text>
  <text x="594" y="839" class="small">tvemu reproduces the observed wire behavior</text>
  <path d="M761 775V737" class="line" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
</svg>
