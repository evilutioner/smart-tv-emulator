<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc">
  <title id="title">How a remote app, tvemu, the dashboard and test automation fit together</title>
  <desc id="desc">The app under test discovers, pairs with and controls tvemu over the LAN as it would a television. tvemu replays captures of real televisions and vendor apps. The dashboard shows what arrived; tests and coding agents read the same through /api/v1, the scenario checker and the MCP server.</desc>
  <style>
    text { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
    .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .k { font-size: 12px; font-weight: 600; fill: #1f2328; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .tv { fill: #fff8eb; stroke: #BA7517; stroke-width: 2; }
    .pill { fill: #ffffff; stroke: #e8c58a; }
    .ev { fill: #fbf7ff; stroke: #8250df; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .line { stroke: #6e7781; stroke-width: 1.5; fill: none; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      text { fill: #9198a1; } .h, .k { fill: #e6edf3; }
      .box { fill: #161b22; stroke: #3d444d; }
      .tv { fill: #2a1f0d; stroke: #EF9F27; }
      .pill { fill: #0d1117; stroke: #6b4a17; }
      .ev { fill: #1d1530; stroke: #a371f7; }
      .line { stroke: #9198a1; } .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- the app under test -->
  <rect class="box" x="10" y="80" width="200" height="110" rx="12"/>
  <text class="h" x="110" y="122" text-anchor="middle">Your remote app</text>
  <text x="110" y="145" text-anchor="middle">or driver under test,</text>
  <text x="110" y="164" text-anchor="middle">no test hooks</text>

  <line class="line" x1="214" y1="118" x2="326" y2="118" marker-end="url(#a)"/>
  <text x="270" y="90" text-anchor="middle">discover, pair</text>
  <text x="270" y="108" text-anchor="middle">and control</text>
  <line class="line" x1="326" y1="164" x2="214" y2="164" marker-end="url(#a)"/>
  <text x="270" y="184" text-anchor="middle">replies</text>

  <!-- the emulated television -->
  <rect class="tv" x="330" y="40" width="220" height="190" rx="14"/>
  <text class="h" x="440" y="72" text-anchor="middle">tvemu</text>
  <text x="440" y="92" text-anchor="middle">the television, on your LAN</text>
  <rect class="pill" x="350" y="108" width="180" height="30" rx="8"/>
  <text class="k" x="440" y="128" text-anchor="middle">Discovery</text>
  <rect class="pill" x="350" y="144" width="180" height="30" rx="8"/>
  <text class="k" x="440" y="164" text-anchor="middle">Pairing</text>
  <rect class="pill" x="350" y="180" width="180" height="30" rx="8"/>
  <text class="k" x="440" y="200" text-anchor="middle">TV protocol</text>

  <!-- where it comes from -->
  <rect class="ev" x="330" y="268" width="220" height="52" rx="10"/>
  <text class="k" x="440" y="290" text-anchor="middle">Captures of real televisions</text>
  <text x="440" y="308" text-anchor="middle">and vendor apps</text>
  <line class="line" x1="440" y1="266" x2="440" y2="234" marker-end="url(#a)"/>
  <text x="450" y="254">replayed</text>

  <!-- who looks at it -->
  <line class="line" x1="554" y1="95" x2="656" y2="80" marker-end="url(#a)"/>
  <line class="line" x1="554" y1="175" x2="656" y2="190" marker-end="url(#a)"/>

  <rect class="box" x="660" y="40" width="210" height="84" rx="12"/>
  <text class="h" x="765" y="72" text-anchor="middle">Dashboard</text>
  <text x="765" y="94" text-anchor="middle">keys, state and event log,</text>
  <text x="765" y="112" text-anchor="middle">live in your browser</text>

  <rect class="box" x="660" y="146" width="210" height="84" rx="12"/>
  <text class="h" x="765" y="178" text-anchor="middle">Tests and agents</text>
  <text x="765" y="200" text-anchor="middle">/api/v1 · expect · MCP</text>
  <text x="765" y="218" text-anchor="middle">assert what the app sent</text>
</svg>
